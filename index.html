<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameFrame Calculator</title>
<style>
  :root {
    --bg: #15171a; --panel: #1f2226; --line: #33373d; --text: #e8e8e8;
    --muted: #9aa0a6; --accent: #00ae42; --corner: #f39c12;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .top select { min-width: 0; }
  .top .link-btn { padding: 0 10px; font-size: 1rem; }
  .top .link-btn, .top select { height: 40px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .games { columns: 220px; column-gap: 8px; }
  .games button {
    text-align: left; background: #262a2f; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; font: inherit; width: 100%;
    display: block; break-inside: avoid; margin-bottom: 8px;
  }
  .games button:hover { border-color: var(--accent); }
  .games button.active { border-color: var(--accent); background: #1d3326; }
  .games .size { font-size: 1.1rem; font-weight: 600; }
  .games ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: .88rem; }
  .games li span { color: #6f757b; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .toolbar input { flex: 1 1 220px; }
  .empty { color: var(--muted); }
  .inputs { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); min-width: 0; max-width: 100%; }
  #printer { max-width: 100%; }
  input, select {
    background: #262a2f; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font: inherit; min-width: 120px;
  }
  .error { color: #ff6b6b; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.center, th.center { text-align: center; }
  table.progress-table { table-layout: fixed; }
  table.progress-table th:first-child { width: 31%; }
  table.progress-table th:not(:first-child), table.progress-table td:not(:first-child) { text-align: center; }
  .total td { font-weight: 600; border-bottom: none; }
  .progress { height: 8px; background: #262a2f; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: #262a2f; color: var(--text); cursor: pointer; font: inherit; line-height: 1; }
  .stepper button:hover { border-color: var(--accent); }
  input.count { width: 56px; min-width: 0; padding: 4px 6px; text-align: center; }
  tr.complete td { color: var(--accent); }
  tr.complete td:first-child::after { content: " ✓"; }
  .side { margin: 4px 0; }
  .side b { display: inline-block; min-width: 110px; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: .85rem; color: var(--muted); margin-top: 8px; }
  .legend span::before, .swatch { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  .note { font-size: .85rem; color: var(--muted); margin-top: 8px; }
  .note.error { color: #ff6b6b; }
  .promo { border-color: var(--accent); background: linear-gradient(135deg, #1d2a22, var(--panel) 70%); }
  .promo { display: flow-root; }
  .promo-visual { float: right; width: min(42%, 300px); margin: 0 0 0 20px; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background-color: #14171a; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 14px 14px; box-shadow: inset 0 0 24px rgba(0,0,0,.5); }
  .promo-visual img { display: block; width: 100%; height: auto; }
  .promo-visual .promo-photo { margin-top: 10px; border-radius: 6px; }
  .promo-visual figcaption { margin-top: 6px; text-align: center; font-size: .75rem; letter-spacing: .04em; color: var(--muted); }
  @media (max-width: 640px) {
    .promo { display: flex; flex-direction: column; }
    .promo-visual { float: none; order: 1; align-self: center; width: min(100%, 360px); margin: 14px 0 0; }
  }
  .promo h2 { margin-bottom: 1.2em; white-space: pre-line; }
  .promo p, .promo li { text-wrap: pretty; }
  .promo .nobr br { display: none; }
  .promo p { margin: 0 0 8px; }
  .promo ul { margin: 0 0 10px; padding-left: 20px; line-height: 1.5; }
  .promo .promo-note { display: flex; gap: 6px; margin: 0 0 14px; }
  .promo-btn { display: inline-block; background: var(--accent); color: #0f1a13; font-weight: 600; text-decoration: none; border-radius: 6px; padding: 8px 14px; }
  .promo-btn:hover { filter: brightness(1.1); }
  .step-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .step-head h2 { margin: 0; }
  .link-btn { background: #262a2f; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: .85rem; cursor: pointer; }
  .link-btn:hover { border-color: var(--accent); }
  .inventory { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .inv-item { display: flex; flex-direction: column; gap: 6px; background: #262a2f; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .9rem; }
  .inv-item.has { border-color: var(--accent); }
  .sub-head { margin: 16px 0 8px; font-size: .95rem; }
  .add-btn { height: 40px; font-size: 1rem; padding: 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: #1d3326; border: 1px solid var(--accent); border-radius: 16px; padding: 3px 4px 3px 10px; font-size: .9rem; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 1rem; line-height: 1; padding: 0 6px; }
  .chip button:hover { color: var(--text); }
  .board + .board { margin-top: 10px; }
  .board h3 { margin: 0 0 4px; font-size: .95rem; }
  #previews svg + svg { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title"></h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button type="button" class="link-btn" id="resetAll" data-i18n="resetAll"></button>

      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="es">Español</option>
    </select>
    </div>
  </div>

  <section>
    <h2><span data-i18n="step0"></span> <span style="color:var(--muted);font-weight:400" data-i18n="optional"></span></h2>
    <p class="note" style="margin:0 0 12px" data-i18n="step0Note"></p>
    <div class="inventory" id="inventory"></div>
  </section>

  <section>
    <h2 data-i18n="step1"></h2>
    <p class="note error" style="margin:0 0 12px;display:flex;gap:6px"><span>⚠️</span><span style="text-wrap:pretty" data-i18n="disclaimer"></span></p>
    <p class="note" style="margin:0 0 12px" data-i18n="step1Note"></p>
    <div class="toolbar">
      <input type="search" id="filter" data-i18n-placeholder="search">
      <select id="sort" data-i18n-aria="sortLabel">
        <option value="size-asc" data-i18n="sortSizeAsc"></option>
        <option value="size-desc" data-i18n="sortSizeDesc"></option>
        <option value="az" data-i18n="sortAz"></option>
        <option value="za" data-i18n="sortZa"></option>
      </select>
    </div>
    <div class="games" id="games"></div>
    <p class="empty" id="noGames" hidden data-i18n="noGames"></p>
    <h3 class="sub-head" data-i18n="customSize"></h3>
    <div class="inputs">
      <label><span data-i18n="width"></span><input type="number" id="w" min="10" max="200" step="2"></label>
      <label><span data-i18n="length"></span><input type="number" id="l" min="10" max="200" step="2"></label>
      <button type="button" class="link-btn add-btn" id="addSize" data-i18n="add"></button>
    </div>
    <div class="chips" id="selected" hidden></div>
  </section>

  <section>
    <h2 data-i18n="step2"></h2>
    <div class="inputs">
      <label><span data-i18n="printer"></span>
        <select id="printer"></select>
      </label>
      <label id="customWrap" hidden><span data-i18n="customPlate"></span><input type="number" id="custom" min="80" max="1000" step="1" value="220"></label>
      <label><span data-i18n="maxPiece"></span>
        <select id="maxPiece"><option value=""></option></select>
      </label>
    </div>
    <p class="note" id="maxInfo"></p>
    <p class="note" style="margin-top:2px;white-space:pre-line" data-i18n="maxNote"></p>
    <p class="note error" style="margin-top:2px;display:flex;gap:6px"><span>⚠️</span><span style="text-wrap:pretty" data-i18n="plateCheck"></span></p>
  </section>

  <section>
    <div class="step-head">
      <h2 data-i18n="step3"></h2>
      <button type="button" class="link-btn" id="copyLink" data-i18n="copyLink"></button>
    </div>
    <div id="result"></div>
  </section>

  <section>
    <h2 data-i18n="preview"></h2>
    <div id="previews"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="promo">
    <figure class="promo-visual">
      <img id="promoVisualImg" src="gameframe.gif" alt="GameFrame – Modular: 22×30, 30×44, 44×60" width="716" height="542" loading="lazy" onerror="this.parentNode.remove()">
      <figcaption>22×30" · 30×44" · 44×60"</figcaption>
      <img class="promo-photo" src="gameframe_foto.jpg" alt="GameFrame – Modular" width="800" height="600" loading="lazy" onerror="this.remove()">
    </figure>
    <h2 data-i18n="promoTitle"></h2>
    <p id="promoText"></p>
    <ul id="promoFeatures"></ul>
    <p class="note promo-note"><span>ⓘ</span><span data-i18n="promoNote"></span></p>
    <a class="promo-btn" id="promoLink" target="_blank" rel="noopener noreferrer" data-i18n="promoBtn"></a>
  </section>
</main>

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

// All splits of one side, from the fewest pieces up to `extra` more (size lists, descending)
function sideOptions(target, sizes, extra) {
  if (target === 0) return [[]];
  if (target < 0 || sizes.length === 0) return [];
  if (target % sizes.reduce(gcd) !== 0) return [];

  const smallest = sizes[sizes.length - 1];
  const found = [];
  let minN = null;
  for (let n = Math.ceil(target / sizes[0]); n <= Math.floor(target / smallest); n++) {
    if (minN !== null && n > minN + extra) break;
    const before = found.length;
    const picked = [];
    const walk = (i, rest, left) => {
      if (left === 0) { if (rest === 0) found.push([...picked]); return; }
      if (i >= sizes.length || rest > left * sizes[i] || rest < left * smallest) return;
      const s = sizes[i];
      for (let k = Math.min(left, Math.floor(rest / s)); k >= 0; k--) {
        for (let j = 0; j < k; j++) picked.push(s);
        walk(i + 1, rest - k * s, left - k);
        picked.length -= k;
      }
    };
    walk(0, target, n);
    if (minN === null && found.length > before) minN = n;
  }
  return found;
}

const sumSq = list => list.reduce((a, s) => a + s * s, 0);
// A side can be laid out mirror-symmetric if at most one size occurs an odd number of times
const asymmetry = list => Math.max(0, countBySize(list).filter(([, n]) => n % 2).length - 1);
const quality = list => asymmetry(list) * 1e6 + sumSq(list);
const compare = (p, q) => { for (let i = 0; i < p.length; i++) if (p[i] !== q[i]) return p[i] - q[i]; return 0; };
const fits = (c, R) => Object.entries(c).every(([s, n]) => n <= (R[s] || 0));

// Extra pieces per side let different boards share part sizes
const EXTRA_PIECES = 2;
const BEAM_WIDTH = 300;

// Distinct part counts for one board (both sides twice), best layout per count
function boardOptions(board, sizes, allowed, inv) {
  const A = sideOptions(board.w - 2 * CORNER, sizes, EXTRA_PIECES);
  const B = board.w === board.l ? A : sideOptions(board.l - 2 * CORNER, sizes, EXTRA_PIECES);
  const best = new Map();
  for (const a of A) for (const b of B) {
    const c = {};
    for (const s of [...a, ...a, ...b, ...b]) c[s] = (c[s] || 0) + 1;
    // Sizes too long for the chosen plate may only come from the stock
    if (Object.entries(c).some(([s, n]) => !allowed.includes(Number(s)) && n > (inv[s] || 0))) continue;
    const key = PIECES.map(s => c[s] || 0).join();
    const q = quality(a) + quality(b);
    if (!best.has(key) || q < best.get(key).q) best.set(key, { c, a, b, q });
  }
  const total = c => Object.values(c).reduce((x, n) => x + n, 0);
  return [...best.values()].sort((x, y) => total(x.c) - total(y.c) || x.q - y.q).slice(0, 150);
}

// Smallest part set (then fewest new prints, then nicest layouts) that builds every board, one at a time
function planParts(options, inv) {
  const cost = (R, q) => {
    let total = 0, fresh = 0;
    for (const s of PIECES) { total += R[s] || 0; fresh += Math.max(0, (R[s] || 0) - (inv[s] || 0)); }
    return [total, fresh, q];
  };
  let beam = [{ R: {}, q: 0 }];
  for (const opts of options) {
    const next = new Map();
    for (const st of beam) for (const o of opts) {
      const R = { ...st.R };
      for (const [s, n] of Object.entries(o.c)) R[s] = Math.max(R[s] || 0, n);
      const cand = { R, q: st.q + o.q };
      cand.cost = cost(R, cand.q);
      const key = PIECES.map(s => R[s] || 0).join();
      if (!next.has(key) || compare(cand.cost, next.get(key).cost) < 0) next.set(key, cand);
    }
    beam = [...next.values()].sort((x, y) => compare(x.cost, y.cost)).slice(0, BEAM_WIDTH);
  }
  const R = beam[0].R;
  const picks = options.map(opts => opts.filter(o => fits(o.c, R)).reduce((x, y) => y.q < x.q ? y : x));
  return { R, picks };
}

function countBySize(list) {
  const counts = new Map();
  for (const s of list) counts.set(s, (counts.get(s) || 0) + 1);
  return [...counts.entries()].sort((a, b) => b[0] - a[0]);
}

function formatList(list) {
  if (list.length === 0) return T().noPieces;
  return countBySize(list).map(([s, n]) => `${n}× ${s}"`).join(" + ");
}

function plateSize() {
  const p = PRINTERS[$("printer").value];
  return p.plate ?? Number($("custom").value);

function allowedPieces() {
  const manual = Number($("maxPiece").value);
  if (manual) return PIECES.filter(s => s <= manual);
  const usable = plateSize() - PRINT_MARGIN_MM;
  return PIECES.filter(s => PIECE_MM[s] <= usable);
}

  const manual = $("maxPiece").value !== "";
  const allowed = plateChosen || manual ? allowedPieces() : [];
  $("maxInfo").textContent = allowed.length
    ? T()[manual ? "maxInfoManual" : "maxInfo"](allowed[0], PIECE_MM[allowed[0]].toFixed(1), PRINT_MARGIN_MM / 2)
    : "";

  if (!plateChosen || !boards.length) {
    result.append(el("p", { className: "empty", textContent: T().selectPrompt }));
    return;
  }

  if (allowed.length === 0) {
    result.append(el("p", { className: "error", textContent: T().noFit }));
    return;
  }

  const usable = PIECES.filter(s => allowed.includes(s) || (inventory[s] || 0) > 0);
  const options = boards.map(b => boardOptions(b, usable, allowed, inventory));
  const ok = boards.filter((_, i) => options[i].length);
  boards.forEach((b, i) => {
    if (!options[i].length)
      result.append(el("p", { className: "error", textContent: `${b.w}" × ${b.l}": ${T().impossible(usable.map(s => `${s}"`).join(", "))}` }));
  });
  if (!ok.length) return;

  const { R, picks } = planParts(options.filter(o => o.length), inventory);

  ok.forEach((b, i) => {
    const block = el("div", { className: "board" });
    if (boards.length > 1) block.append(el("h3", { textContent: `${b.w}" × ${b.l}"` }));
    for (const [len, seg] of [[b.w, picks[i].a], [b.l, picks[i].b]])
      block.append(el("div", { className: "side" }, el("b", { textContent: T().side(len) }), " ",
        `${T().corner} + ${formatList(seg)} + ${T().corner}`));
    result.append(block);
  });

  const have = k => Math.min(k === "corner" ? 4 : R[k], inventory[k] || 0);
  const items = [{ key: "corner", label: T().cornerPiece, color: "var(--corner)", need: 4, have: have("corner") },
    ...PIECES.filter(s => R[s]).map(s => ({ key: String(s), label: T().straight(s), color: PIECE_COLORS[s], need: R[s], have: have(s) }))];
  const showHave = Object.values(inventory).some(n => n > 0);
  result.append(el("h2", { textContent: T().parts, style: "margin-top:16px" }), progressTable(items, progressKey(), showHave));

  ok.forEach((b, i) => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    $("previews").append(svg);
    drawPreview(svg, b.w, b.l, picks[i].a, picks[i].b);
  });
}

function loadProgress(key) {
  try { return JSON.parse(localStorage.getItem(`gf-progress:${key}`)) || {}; } catch { return {}; }
}

function saveProgress(key, data) {
  try { localStorage.setItem(`gf-progress:${key}`, JSON.stringify(data)); } catch { /* storage blocked */ }
}

// Parts list where the user tracks how many of the parts still to print are done
function progressTable(items, storeKey, showHave) {
  const t = T();
  const done = loadProgress(storeKey);
  const wrap = el("div");
  const bar = el("div", { className: "progress" }, el("div", { className: "progress-fill" }));
  const status = el("p", { className: "note", style: "margin:6px 0 10px" });
  const table = el("table", { className: "progress-table" });
  table.append(el("tr", {},
    el("th", { textContent: t.part }),
    el("th", { textContent: t.needed }),
    ...(showHave ? [el("th", { textContent: t.have })] : []),
    el("th", { textContent: t.printed }),
    el("th", { textContent: t.open })));

  const swatch = c => { const s = el("span", { className: "swatch" }); s.style.setProperty("--c", c); return s; };
  const toPrint = i => i.need - i.have;
  const totalNew = items.reduce((a, i) => a + toPrint(i), 0);
  const totalDone = el("td"), totalOpen = el("td");

  const refresh = () => {
    const printed = items.reduce((a, i) => a + Math.min(done[i.key] || 0, toPrint(i)), 0);
    totalDone.textContent = printed;
    totalOpen.textContent = totalNew - printed;
    bar.firstChild.style.width = `${totalNew ? (printed / totalNew) * 100 : 100}%`;
    status.textContent = totalNew === 0 ? t.nothingToPrint : printed >= totalNew ? t.allDone : t.progressNote(printed, totalNew);
    saveProgress(storeKey, done);
    currentProgress = done;
    saveToUrl();
  };

  const setters = [];
  for (const item of items) {
    const max = toPrint(item);
    const openCell = el("td");
    const printedCell = el("td");
    const row = el("tr", {},
      el("td", {}, swatch(item.color), item.label),
      el("td", { textContent: item.need }),
      ...(showHave ? [el("td", { textContent: item.have })] : []),
      printedCell, openCell);
    table.append(row);

    if (max === 0) {
      printedCell.textContent = "–";
      openCell.textContent = 0;
      row.classList.add("complete");
      continue;
    }
    const input = el("input", { type: "number", min: 0, max, value: Math.min(done[item.key] || 0, max), className: "count" });
    const set = v => {
      v = Math.min(max, Math.max(0, Math.round(Number(v) || 0)));
      input.value = v;
      done[item.key] = v;
      openCell.textContent = max - v;
      row.classList.toggle("complete", v >= max);
      refresh();
    };
    printedCell.append(el("div", { className: "stepper" },
      el("button", { type: "button", textContent: "−", onclick: () => set(Number(input.value) - 1) }),
      input,
      el("button", { type: "button", textContent: "+", onclick: () => set(Number(input.value) + 1) })));
    input.addEventListener("input", () => set(input.value));
    setters.push(set);
    set(input.value);
  }

  table.append(el("tr", { className: "total" },
    el("td", { textContent: t.total }), el("td", { textContent: items.reduce((a, i) => a + i.need, 0) }),
    ...(showHave ? [el("td", { textContent: items.reduce((a, i) => a + i.have, 0) })] : []),
    totalDone, totalOpen));

  const reset = el("button", { type: "button", className: "link-btn", textContent: t.resetProgress, style: "margin-top:10px" });
  // Reset in place so the progress bar animates back to zero
  reset.addEventListener("click", () => setters.forEach(set => set(0)));

  refresh();
  wrap.append(bar, status, table);
  if (totalNew > 0) wrap.append(reset);
  return wrap;
}

// Mirror pairs of equal pieces around the centre; unpaired pieces go in the middle
function symmetric(list) {
  const left = [], middle = [];
  for (const [s, n] of countBySize(list)) {
    for (let i = 0; i < Math.floor(n / 2); i++) left.push(s);
    if (n % 2) middle.push(s);
  }
  return [...left, ...middle, ...[...left].reverse()];
}

function drawPreview(svg, w, l, segW, segL) {
  const NS = "http://www.w3.org/2000/svg";
  // Longer side horizontal for a better fit
  const flip = l > w;
  const H = flip ? l : w, V = flip ? w : l;
  const segH = (flip ? segL : segW) && symmetric(flip ? segL : segW);
  const segV = (flip ? segW : segL) && symmetric(flip ? segW : segL);
  const gap = 0.15, pad = 1;

  svg.setAttribute("viewBox", `${-pad} ${-pad} ${H + 2 * pad} ${V + 2 * pad}`);
  // Scale with frame size: 72" and larger use full width, small frames shrink (min. 35 %)
  svg.style.width = `${Math.min(100, Math.max(35, H / 72 * 100))}%`;
  svg.style.marginInline = "auto";
  svg.replaceChildren();

  // Font sizes are given in screen pixels and converted to SVG units
  const pxPerUnit = svg.getBoundingClientRect().width / (H + 2 * pad) || 10;
  const pieceFont = Math.max(0.7, 12 / pxPerUnit);
  const dimsFont = Math.max(Math.min(H, V) / 14, 15 / pxPerUnit);
  const bar = Math.max(1.2, pieceFont * 1.7);

  const rect = (x, y, rw, rh, fill) => {
    const r = document.createElementNS(NS, "rect");
    for (const [k, v] of Object.entries({ x, y, width: Math.max(rw, 0), height: Math.max(rh, 0), rx: 0.15 })) r.setAttribute(k, v);
    // style instead of attribute so CSS variables resolve
    r.style.fill = fill;
    svg.append(r);
  };
  const label = (x, y, text, rotate) => {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", x); t.setAttribute("y", y);
    t.setAttribute("font-size", pieceFont); t.setAttribute("fill", "#fff");
    t.setAttribute("text-anchor", "middle"); t.setAttribute("dominant-baseline", "central");
    if (rotate) t.setAttribute("transform", `rotate(-90 ${x} ${y})`);
    t.textContent = text;
    svg.append(t);
  };

  rect(bar, bar, H - 2 * bar, V - 2 * bar, "#262a2f");

  const dims = document.createElementNS(NS, "text");
  for (const [k, v] of Object.entries({ x: H / 2, y: V / 2, "font-size": dimsFont, fill: "#9aa0a6",
    "text-anchor": "middle", "dominant-baseline": "central", "font-weight": "600" })) dims.setAttribute(k, v);
  dims.textContent = `${V}" × ${H}"`;
  svg.append(dims);

  for (const [cx, cy, sx, sy] of [[0, 0, 1, 1], [H, 0, -1, 1], [0, V, 1, -1], [H, V, -1, -1]]) {
    const len = CORNER - gap;
    rect(sx > 0 ? cx : cx - len, sy > 0 ? cy : cy - bar, len, bar, "var(--corner)");
    rect(sx > 0 ? cx : cx - bar, sy > 0 ? cy : cy - len, bar, len, "var(--corner)");
  }

  const color = s => PIECE_COLORS[s];
  if (segH) {
    let x = CORNER;
    for (const s of segH) {
      for (const y of [0, V - bar]) {
        rect(x + gap / 2, y, s - gap, bar, color(s));
        label(x + s / 2, y + bar / 2, `${s}"`);
      }
      x += s;
    }
  }
  if (segV) {
    let y = CORNER;
    for (const s of segV) {
      for (const x of [0, H - bar]) {
        rect(x, y + gap / 2, bar, s - gap, color(s));
        label(x + bar / 2, y + s / 2, `${s}"`, true);
      }
      y += s;
    }
  }
}

function sizeKey(w, l) { return `${Math.max(w, l)}x${Math.min(w, l)}`; }

function buildGroups() {
  const groups = new Map();
  for (const g of GAMES) {
    const key = sizeKey(g.w, g.l);
    if (!groups.has(key)) groups.set(key, { key, w: Math.max(g.w, g.l), l: Math.min(g.w, g.l), games: [] });
    groups.get(key).games.push(g);
  }
  const byName = (a, b) => a.name.localeCompare(b.name) || a.detail.localeCompare(b.detail);
  for (const grp of groups.values()) grp.games.sort(byName);
  return [...groups.values()];
}

const GROUPS = buildGroups();
let boards = [];
let inventory = {};
const INV_KEYS = ["corner", ...[...PIECES].reverse().map(String)];
const isSelected = key => boards.some(b => sizeKey(b.w, b.l) === key);

function toggleBoard(w, l) {
  const key = sizeKey(w, l);
  if (isSelected(key)) boards = boards.filter(b => sizeKey(b.w, b.l) !== key);
  else boards.push({ w: Math.min(w, l), l: Math.max(w, l) });
  renderGames();
  renderSelected();
  render();
}

function renderSelected() {
  const box = $("selected");
  box.replaceChildren();
  box.hidden = !boards.length;
  if (!boards.length) return;
  box.append(el("span", { className: "note", style: "margin:0", textContent: T().selected }));
  for (const b of boards) {
    const x = el("button", { type: "button", textContent: "×", title: T().remove });
    x.setAttribute("aria-label", T().remove);
    x.addEventListener("click", () => toggleBoard(b.w, b.l));
    box.append(el("span", { className: "chip" }, `${b.w}" × ${b.l}"`, x));
  }
}

function renderInventory() {
  const box = $("inventory");
  box.replaceChildren();
  for (const k of INV_KEYS) {
    const swatch = el("span", { className: "swatch" });
    swatch.style.setProperty("--c", k === "corner" ? "var(--corner)" : PIECE_COLORS[k]);
    const input = el("input", { type: "number", min: 0, max: 999, value: inventory[k] || 0, className: "count" });
    const item = el("div", { className: "inv-item" }, el("span", {}, swatch, k === "corner" ? T().cornerPiece : `${k}"`));
    const set = v => {
      v = Math.min(999, Math.max(0, Math.round(Number(v) || 0)));
      input.value = v;
      if (v) inventory[k] = v; else delete inventory[k];
      item.classList.toggle("has", v > 0);
      render();
    };
    input.addEventListener("input", () => set(input.value));
    item.classList.toggle("has", (inventory[k] || 0) > 0);
    item.append(el("div", { className: "stepper" },
      el("button", { type: "button", textContent: "−", onclick: () => set(Number(input.value) - 1) }),
      input,
      el("button", { type: "button", textContent: "+", onclick: () => set(Number(input.value) + 1) })));
    box.append(item);
  }
}

function renderGames() {
  const container = $("games");
  const q = $("filter").value.trim().toLowerCase();
  const sort = $("sort").value;
  const label = g => g.detail === "Standard" ? g.name : `${g.name} – ${detailText(g.detail)}`;

  const visible = GROUPS
    .map(grp => ({ ...grp, games: grp.games.filter(g => label(g).toLowerCase().includes(q)) }))
    .filter(grp => grp.games.length > 0);

  // Ascending: shorter side first; descending: longer side first (grp.l = shorter, grp.w = longer)
  const sorters = {
    "size-asc": (a, b) => a.l - b.l || a.w - b.w,
    "size-desc": (a, b) => b.w - a.w || b.l - a.l,
    "az": (a, b) => a.games[0].name.localeCompare(b.games[0].name, lang),
    "za": (a, b) => b.games.at(-1).name.localeCompare(a.games.at(-1).name, lang),
  };
  visible.sort(sorters[sort]);

  container.replaceChildren();
  for (const grp of visible) {
    const games = sort === "za" ? [...grp.games].reverse() : grp.games;
    const list = el("ul");
    for (const g of games) {
      const li = el("li", { textContent: g.name });
      if (g.detail !== "Standard") li.append(" ", el("span", { textContent: `(${detailText(g.detail)})` }));
      list.append(li);
    }
    const btn = el("button", { type: "button", className: isSelected(grp.key) ? "active" : "" },
      el("div", { className: "size", textContent: sort === "size-desc" ? `${grp.w}" × ${grp.l}"` : `${grp.l}" × ${grp.w}"` }), list);
    btn.addEventListener("click", () => toggleBoard(grp.l, grp.w));
    container.append(btn);
  }
  $("noGames").hidden = visible.length > 0;
}

function lineWidths(e) {
  const range = document.createRange();
  range.selectNodeContents(e);
  const lines = new Map();
  for (const r of range.getClientRects()) {
    if (r.width <= 0) continue;
    const top = Math.round(r.top), cur = lines.get(top);
    lines.set(top, cur ? [Math.min(cur[0], r.left), Math.max(cur[1], r.right)] : [r.left, r.right]);
  }
  return [...lines.values()].map(([l, r]) => r - l);
}

function withBreaks(text) {
  return text.split("\n").flatMap((part, i) => i ? [" ", el("br"), part] : [part]);
}

function fixOrphans() {
  // Preferred breaks are dropped when a segment doesn't fit; browsers skip text-wrap balancing next to floats, so narrow blocks with a short last line.
  for (const e of document.querySelectorAll("#promoText, .promo li")) {
    e.classList.remove("nobr");
    e.style.maxWidth = "";
    let widths = lineWidths(e);
    if (widths.length > e.querySelectorAll("br").length + 1) {
      e.classList.add("nobr");
      widths = lineWidths(e);
    } else if (e.querySelector("br")) continue;
    if (widths.length < 2 || widths.at(-1) >= 0.5 * Math.max(...widths)) continue;
    let lo = e.clientWidth * 0.5, hi = e.clientWidth;
    const target = widths.length;
    while (hi - lo > 4) {
      const mid = (lo + hi) / 2;
      e.style.maxWidth = mid + "px";
      if (lineWidths(e).length > target) lo = mid; else hi = mid;
    }
    e.style.maxWidth = Math.ceil(hi) + "px";
  }
}

function applyLanguage() {
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t[e.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(e => { e.placeholder = t[e.dataset.i18nPlaceholder]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(e => { e.setAttribute("aria-label", t[e.dataset.i18nAria]); });

  const select = $("printer");
  select.options[0].textContent = t.choosePlate;
  PRINTERS.forEach((p, i) => { select.options[i + 1].textContent = p.plate ? `${p.plate} mm – ${t.eg} ${p.ex}` : t.customPrinter; });
  $("maxPiece").options[0].textContent = t.maxAuto;

  const legend = $("legend");
  legend.replaceChildren();
  for (const [c, text] of [["var(--corner)", t.cornerPiece], ...[...PIECES].reverse().map(s => [PIECE_COLORS[s], `${s}"`])]) {
    const item = el("span", { textContent: text });
    item.style.setProperty("--c", c);
    legend.append(item);
  }

  $("promoLink").href = ORIGINAL_URL;
  $("promoText").replaceChildren(...withBreaks(t.promoText));
  $("promoFeatures").replaceChildren(...t.promoFeatures.map(([head, text]) =>
    el("li", {}, ...(head ? [el("strong", { textContent: head }), " "] : []), ...withBreaks(text))));
  fixOrphans();

  renderInventory();
  renderSelected();
  renderGames();
  render();
}

const evenInch = v => Math.min(200, Math.max(10, Math.round(Number(v) / 2) * 2));
const progressKey = () => `${boards.map(b => `${b.w}x${b.l}`).sort().join("+")}@${plateSize()}${$("maxPiece").value ? `~${$("maxPiece").value}` : ""}`;
let currentProgress = null;

// Count maps as "part.count" pairs joined by "_" (URL-safe), e.g. corner.4_12.14
const encodeCounts = obj => INV_KEYS.filter(k => obj?.[k] > 0).map(k => `${k}.${obj[k]}`).join("_");
function decodeCounts(str) {
  const out = {};
  for (const pair of (str || "").split("_")) {
    const [k, v] = pair.split(".");
    if (INV_KEYS.includes(k) && Number(v) > 0) out[k] = Math.min(999, Math.round(Number(v)));
  }
  return out;
}

function saveToUrl() {
  const params = new URLSearchParams();
  if (boards.length) params.set("b", boards.map(b => `${b.w}x${b.l}`).join("_"));
  if ($("printer").value !== "") {
    const p = PRINTERS[$("printer").value];
    params.set("plate", p.plate ?? "custom");
    if (p.plate === null) params.set("mm", $("custom").value);
  }
  if ($("maxPiece").value) params.set("max", $("maxPiece").value);
  if (encodeCounts(inventory)) params.set("inv", encodeCounts(inventory));
  if (encodeCounts(currentProgress)) params.set("done", encodeCounts(currentProgress));
  const query = params.toString();
  history.replaceState(null, "", location.pathname + (query ? `?${query}` : ""));
  try { localStorage.setItem("gf-last", query); } catch { /* storage blocked */ }
}

function loadFromUrl() {
  let search = location.search;
  // No link parameters: continue where the user left off in this browser
  if (!search) try { search = localStorage.getItem("gf-last") || ""; } catch { /* storage blocked */ }
  const params = new URLSearchParams(search);
  // "w"/"l" is the older single-board link format
  const list = params.has("b") ? params.get("b").split("_") : params.has("w") ? [`${params.get("w")}x${params.get("l")}`] : [];
  for (const item of list) {
    const [w, l] = item.split("x").map(Number);
    if (Number.isFinite(w) && Number.isFinite(l) && !isSelected(sizeKey(evenInch(w), evenInch(l))))
      boards.push({ w: Math.min(evenInch(w), evenInch(l)), l: Math.max(evenInch(w), evenInch(l)) });
  }
  const plate = params.get("plate");
  const idx = PRINTERS.findIndex(p => String(p.plate) === plate);
  if (idx >= 0) $("printer").value = String(idx);
  else if (plate === "custom") {
    $("printer").value = String(PRINTERS.length - 1);
    const mm = Number(params.get("mm"));
    if (mm >= 80 && mm <= 1000) $("custom").value = mm;
  }
  if (PIECES.includes(Number(params.get("max")))) $("maxPiece").value = params.get("max");
  inventory = decodeCounts(params.get("inv"));
  if (params.has("done") && boards.length && $("printer").value !== "")
    saveProgress(progressKey(), decodeCounts(params.get("done")));
}

function init() {
  const select = $("printer");
  select.append(el("option", { value: "", disabled: true, selected: true }));
  PRINTERS.forEach((p, i) => select.append(el("option", { value: String(i) })));
  for (const s of [...PIECES].reverse())
    $("maxPiece").append(el("option", { value: String(s), textContent: `${s}" (${PIECE_MM[s].toFixed(1)} mm)` }));
  loadFromUrl();

  // Clear inputs and all saved progress; the chosen language is kept
  $("resetAll").addEventListener("click", () => {
    if (!confirm(T().resetConfirm)) return;
    try {
      for (const k of Object.keys(localStorage))
        if (k === "gf-last" || k.startsWith("gf-progress:")) localStorage.removeItem(k);
    } catch { /* storage blocked */ }
    location.href = location.pathname;
  });

  $("copyLink").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      $("copyLink").textContent = T().copied;
      setTimeout(() => { $("copyLink").textContent = T().copyLink; }, 2000);
    } catch { /* clipboard blocked */ }
  });

  let saved = null;
  try { saved = localStorage.getItem("rahmen-lang"); } catch { /* storage blocked */ }
  lang = I18N[saved] ? saved : "en";
  $("lang").value = lang;
  $("lang").addEventListener("input", e => {
    lang = e.target.value;
    try { localStorage.setItem("rahmen-lang", lang); } catch { /* storage blocked */ }
    applyLanguage();
  });

  for (const id of ["w", "l"]) {
    // Snap typed values to the nearest even inch once editing is finished
    $(id).addEventListener("change", e => { if (e.target.value !== "") e.target.value = evenInch(e.target.value); });
    $(id).addEventListener("keydown", e => { if (e.key === "Enter") $("addSize").click(); });
  }
  $("addSize").addEventListener("click", () => {
    if (!$("w").value || !$("l").value) return;
    const w = evenInch($("w").value), l = evenInch($("l").value);
    if (!isSelected(sizeKey(w, l))) toggleBoard(w, l);
    $("w").value = "";
    $("l").value = "";
  });
  for (const id of ["printer", "custom", "maxPiece"]) $(id).addEventListener("input", render);
  for (const id of ["filter", "sort"]) $(id).addEventListener("input", renderGames);
  window.addEventListener("resize", render);
  window.addEventListener("resize", fixOrphans);
  $("promoVisualImg")?.addEventListener("load", fixOrphans);

  applyLanguage();
}

init();
</script>
</body>
</html>
